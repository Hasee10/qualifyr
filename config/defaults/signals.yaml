# Signals that suggest the company is actively operating / investing (buying evidence).
buying_signal_keywords:
  hiring:
    - we are hiring
    - careers
    - join our team
    - job openings
    - vacancies
  expansion:
    - new branch
    - now open in
    - expanding
    - grand opening
    - new outlet
    - new store
  ecommerce_active:
    - add to cart
    - shop now
    - buy now
    - checkout
    - cash on delivery
    - free shipping
    - track your order
  operations_scale:
    - branches
    - outlets
    - nationwide
    - across pakistan
    - distribution network
    - warehouse
    - fleet

# Pain points a buyer may state publicly. Used for prioritization and personalization hooks.
pain_signal_keywords:
  manual_process:
    - manual
    - spreadsheet
    - paperwork
  delivery_issues:
    - delayed delivery
    - delivery delays
    - order tracking
  growth_pressure:
    - growing fast
    - rapid growth
    - scaling
  customer_service_load:
    - whatsapp us
    - call us for orders
    - dm to order
    - inbox to order

