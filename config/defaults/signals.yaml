    - launches
    - launch of
    - introducing
    - unveils
    - new product
    - now available
  funding:
    - raises
    - funding round
    - series a
    - series b
    - series c
    - seed round
    - investment from
    - secures funding
  partnership:
    - partners with
    - partnership with
    - collaborates with
    - strategic alliance
  expansion_press:
    - expands to
    - opens new
    - enters the market
    - new office
    - new facility

