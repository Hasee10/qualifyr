# Non-English translations of the generic vendor-service signals in vendor_rules.yaml
# (negative_keywords, vendor_phrases). These are deliberately limited to terms that are
# universal across campaigns ("consulting", "our clients include") - NOT campaign-specific
# buyer terms (those come from the user's own target_industries/buyer_keywords and can't be
# pre-translated; the LLM grounded fallback in llm/tasks.py handles that side instead).
#
# Keyed by ISO 639-1 language code, detected from the crawled page text
# (gtm_engine/enrichment/language.py). Only languages with a real, maintained list are
# used; any other detected language just skips this i18n boost and falls back to the
# LLM for ambiguous (UNKNOWN) cases when available.

