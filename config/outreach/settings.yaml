# Outreach settings. Credentials never live here: set GTM_SMTP_USER and GTM_SMTP_PASSWORD
# (Gmail address + App Password). Without them every send is a dry run to data/outbox/.
sender_name: "Qualifyr Team"
reply_to: null                 # defaults to the sending address
smtp_host: smtp.gmail.com
smtp_port: 587
imap_host: imap.gmail.com

daily_limit: 40                # per mailbox per calendar day (Gmail free tier: stay well under 100)
delay_between_sends_s: 45      # slow is safer for deliverability
send_window_start_hour: 9      # local business hours only
send_window_end_hour: 18
timezone: Asia/Karachi
skip_weekends: true

followup_1_after_days: 3
followup_2_after_days: 4       # after follow-up 1
require_approval: true         # every email is reviewed (and optionally edited) in the UI before it is sent
