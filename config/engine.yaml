# Runtime settings. Any key can be overridden with an env var GTM_<KEY>, e.g. GTM_DB_PATH.
db_path: data/gtm.sqlite
export_dir: data/exports
user_agent: "GTMLeadEngine/0.1 (+business research; contact via site form)"
request_timeout_s: 15
per_host_delay_s: 2.0
max_retries: 2
concurrency: 4
respect_robots: true
enable_browser_fallback: false   # pip install -e ".[browser]" && playwright install chromium
overpass_url: https://overpass-api.de/api/interpreter
overpass_timeout_s: 90
enable_search_fallback: true   # Brave Search if GTM_BRAVE_API_KEY is set, else DuckDuckGo HTML
search_delay_s: 5.0
enable_domain_age: true         # RDAP (not available for .pk)
enable_news_signals: true       # GDELT, throttled to one request per 5.5 s
news_max_companies_per_run: 40
dns_timeout_s: 5.0
# Mailbox-level verification backend: auto (Reacher URL > direct SMTP if port 25 open > Hunter key > MX-only)
email_verification: auto
reacher_url: null              # e.g. http://localhost:8080 for a self-hosted Reacher
discover_decision_maker_email: true
# Optional LLM layer: Ollama locally (no key) or GTM_GROQ_API_KEY / GTM_GEMINI_API_KEY.
# Used only for requirement extraction, unlabelled-reply second opinion and hook drafting;
# outputs are grounded in observed text and labelled llm:.
enable_llm: false
llm_provider: auto
llm_model: null
enable_intent_signals: true     # PPRA tender match + RFQ/hiring phrases on company pages
log_level: INFO
