name: Gather leads

on:
  workflow_dispatch:
    inputs:
      campaign:
        description: Campaign YAML path
        default: config/campaigns/example_retail_islamabad.yaml
      max_companies:
        description: Companies to process this run
        default: "60"
      commit_results:
        description: Commit CSVs into leads/ (otherwise artifacts only)
        type: boolean
        default: true
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC (08:00 PKT)

concurrency:
  # Per campaign, not global. Two campaigns share nothing - separate rows, separate
  # leads/<campaign>/ output - but one group meant dispatching three at once left
  # GitHub cancelling the queued ones, so two of the three silently never ran and sat
  # wedged at "starting" instead. Same campaign twice still queues, which is the case
  # that genuinely conflicts.
  group: gather-leads-${{ github.event.inputs.campaign || 'config/campaigns/example_retail_islamabad.yaml' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CAMPAIGN: ${{ github.event.inputs.campaign || 'config/campaigns/example_retail_islamabad.yaml' }}
      MAX_COMPANIES: ${{ github.event.inputs.max_companies || '60' }}
      COMMIT_RESULTS: ${{ github.event.inputs.commit_results || 'true' }}
      GTM_SHEETS_CREDENTIALS_JSON: ${{ secrets.GTM_SHEETS_CREDENTIALS_JSON }}
      GTM_SHEETS_SPREADSHEET_ID: ${{ secrets.GTM_SHEETS_SPREADSHEET_ID }}
      GTM_BRAVE_API_KEY: ${{ secrets.GTM_BRAVE_API_KEY }}
      GTM_DATABASE_URL: ${{ secrets.GTM_DATABASE_URL }}
      # Read by validation/verifier.py (mailbox verification) and llm/client.py. Without
      # them the crawl silently downgrades: no mailbox confirmation, no LLM layer.
      GTM_HUNTER_API_KEY: ${{ secrets.GTM_HUNTER_API_KEY }}
      GTM_GROQ_API_KEY: ${{ secrets.GTM_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[api,overture,sheets]"

      # Local geocode cache only (dedupe/suppression state now lives in Postgres).
      - name: Restore geocode cache
        uses: actions/cache/restore@v4
        with:
          path: data/geocode_cache.json
          key: gtm-geocode-${{ github.run_id }}
          restore-keys: gtm-geocode-

      - name: Run campaign
        run: python -m gtm_engine.cli run "$CAMPAIGN" --max-companies "$MAX_COMPANIES"

      - name: Mirror qualified leads to Google Sheets (when configured)
        if: env.GTM_SHEETS_SPREADSHEET_ID != ''
        run: |
          campaign_id=$(python -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['campaign_id'])" "$CAMPAIGN")
          python -m gtm_engine.cli sheets "$campaign_id" || echo "sheets export failed (non-fatal)"

      - name: Save geocode cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/geocode_cache.json
          key: gtm-geocode-${{ github.run_id }}

      - name: Upload CSVs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: data/exports/*.csv
          retention-days: 90

      - name: Commit results into leads/
        if: env.COMMIT_RESULTS == 'true'
        run: |
          campaign_id=$(python -c "import yaml,sys;print(yaml.safe_load(open(sys.argv[1]))['campaign_id'])" "$CAMPAIGN")
          mkdir -p "leads/$campaign_id"
          cp data/exports/*_qualified.csv "leads/$campaign_id/"
          cp data/exports/*_all.csv "leads/$campaign_id/"
          # Keep a stable "latest" pointer so downstream tools have a fixed path.
          cp "$(ls -t data/exports/*_qualified.csv | head -1)" "leads/$campaign_id/latest_qualified.csv"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads
          git diff --cached --quiet && echo "no new leads" && exit 0
          git commit -m "leads: $campaign_id run ${{ github.run_number }} [skip ci]"
          # The branch moves under us. A crawl takes minutes, during which another
          # campaign's run commits its own leads and ordinary development gets pushed,
          # so a bare push fails non-fast-forward and reds the job *after* the pipeline
          # already succeeded - losing the CSVs for a reason unrelated to the run.
          # Each run writes only leads/<its own campaign>/, so rebasing is safe.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "could not push leads after 3 attempts" >&2
          exit 1
