name: Verify sent

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        default: retail-isb-001

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GTM_SMTP_USER: ${{ secrets.GTM_SMTP_USER }}
      GTM_SMTP_PASSWORD: ${{ secrets.GTM_SMTP_PASSWORD }}
      GTM_GMAIL_CLIENT_ID: ${{ secrets.GTM_GMAIL_CLIENT_ID }}
      GTM_GMAIL_CLIENT_SECRET: ${{ secrets.GTM_GMAIL_CLIENT_SECRET }}
      GTM_GMAIL_REFRESH_TOKEN: ${{ secrets.GTM_GMAIL_REFRESH_TOKEN }}
      # Additional mailboxes for rotation (Phase C); leave unset until you have them.
      GTM_MAILBOX_1_USER: ${{ secrets.GTM_MAILBOX_1_USER }}
      GTM_MAILBOX_1_PASSWORD: ${{ secrets.GTM_MAILBOX_1_PASSWORD }}
      GTM_MAILBOX_2_USER: ${{ secrets.GTM_MAILBOX_2_USER }}
      GTM_MAILBOX_2_PASSWORD: ${{ secrets.GTM_MAILBOX_2_PASSWORD }}
      GTM_MAILBOX_3_USER: ${{ secrets.GTM_MAILBOX_3_USER }}
      GTM_MAILBOX_3_PASSWORD: ${{ secrets.GTM_MAILBOX_3_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m gtm_engine.cli outreach verify "${{ github.event.inputs.campaign_id }}"
