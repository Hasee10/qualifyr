name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["leads/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A throwaway Postgres so the DB-backed tests actually run (86 of them skip without one).
    # Each test creates and drops its own schema, so one instance is enough and nothing leaks.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GTM_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[api,dev]"
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `next build` runs the type-checker and ESLint, so this is the frontend's full gate.
      - run: npm run build
